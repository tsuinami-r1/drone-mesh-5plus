<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Top view of the v2 enclosure: four patch antennas on the four faces, each covering a 70 degree sector; a drone at bearing 40 degrees is seen strongest by the north patch and next by the east patch, and the ratio of those two powers gives the bearing" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" style="color:#16202A">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- beam wedges (70° each, centred on faces) -->
  <g fill="#0F7F73" fill-opacity="0.10" stroke="#0F7F73" stroke-width="1" stroke-dasharray="3 3">
    <path d="M200,200 L124,26 A190,190 0 0 1 276,26 Z"/>
    <path d="M200,200 L374,124 A190,190 0 0 1 374,276 Z"/>
    <path d="M200,200 L276,374 A190,190 0 0 1 124,374 Z"/>
    <path d="M200,200 L26,276 A190,190 0 0 1 26,124 Z"/>
  </g>
  <!-- enclosure -->
  <rect x="150" y="150" width="100" height="100" rx="4" stroke="currentColor" fill="none" stroke-width="1.4"/>
  <text x="200" y="212" text-anchor="middle" fill="currentColor" font-size="10.5">IP65 box</text>
  <text x="200" y="226" text-anchor="middle" fill="currentColor" font-size="10.5">XIAO · RX5808</text>
  <text x="200" y="240" text-anchor="middle" fill="currentColor" font-size="10.5">switch · Heltec</text>
  <!-- patches on faces -->
  <g fill="#0F7F73">
    <rect x="175" y="140" width="50" height="8"/>
    <rect x="252" y="175" width="8" height="50"/>
    <rect x="175" y="252" width="50" height="8"/>
    <rect x="140" y="175" width="8" height="50"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-weight="600">
    <text x="200" y="134">N 0°</text>
    <text x="284" y="204">E 90°</text>
    <text x="200" y="274">S 180°</text>
    <text x="116" y="204">W 270°</text>
  </g>
  <!-- drone at bearing 30° -->
  <g transform="translate(200,200)">
    <line x1="0" y1="0" x2="100" y2="-119" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
    <line x1="0" y1="-38" x2="0" y2="-10" stroke="currentColor" stroke-width="1"/>
    <path d="M0,-34 A34,34 0 0 1 22,-26" stroke="currentColor" fill="none" stroke-width="1"/>
    <text x="30" y="-42" fill="currentColor" font-size="11">θ ≈ 40°</text>
  </g>
  <text x="312" y="74" fill="currentColor" font-weight="600">VTX</text>
  <!-- readings -->
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="currentColor">
    <text x="330" y="310">N  −62 dBm  ◀ strongest</text>
    <text x="330" y="326">E  −68 dBm  ◀ neighbour</text>
    <text x="330" y="342">S  −84 dBm</text>
    <text x="330" y="358">W  −79 dBm</text>
  </g>
  <text x="330" y="382" fill="currentColor" font-size="11">bearing ≈ 0° + k·(P_E − P_W) → ~40° ± 15°</text>
  <text x="20" y="382" fill="currentColor" font-size="10.5">top view · patches tilted 10–15° up</text>
</svg>
