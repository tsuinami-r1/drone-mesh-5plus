; Level 1 station v2 — analog FPV detection with sector DF + video fingerprint
;
;   pio run -e seeed_xiao_esp32s3      XIAO ESP32-S3
;   pio run -e seeed_xiao_esp32c5      XIAO ESP32-C5
;
; The receiver driver is selected with -DRECEIVER_*; only RX5808 exists today.
; Pins and every tuneable live in src/config.h.

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
build_flags = -std=gnu++17 -DRECEIVER_RX5808

[env:seeed_xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c5
monitor_speed = 115200
build_flags = -std=gnu++17 -DRECEIVER_RX5808
