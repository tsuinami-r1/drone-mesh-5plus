; Single-band S3 dual-core variant. Tasks are pinned to core 1, so this builds
; only for the dual-core ESP32-S3 — a single-core target (e.g. C6) would abort
; at boot in xTaskCreatePinnedToCore, so no such env is defined here.
[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps =
  bblanchon/ArduinoJson@^6.18.5