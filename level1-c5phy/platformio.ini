; Level 1 station v3 prototype — the XIAO ESP32-C5's own 5 GHz Wi-Fi PHY is the
; analog FPV receiver. No RX5808, no sync separator.
;
;   pio run -e seeed_xiao_esp32c5                    build
;   pio run -e seeed_xiao_esp32c5 --target upload    flash (full erase first, see README)
;
; XIAO ESP32-C5 ONLY. The S3 has no 5 GHz radio, so there is no S3 environment
; and src/config.h refuses any other board. Pins and every tuneable live in
; src/config.h.
;
; The platform version is pinned on purpose: c5phy_rf.cpp links undocumented
; PHY symbols (phy_set_freq, phy_force_rx_gain, ...) that this exact
; framework's libphy.a exports. Bumping the platform means re-checking them
; (see "Toolchain pin" in README.md).

[env:seeed_xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c5
monitor_speed = 115200
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=0
